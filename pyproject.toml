[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-linkedin-agent"
version = "1.0.0"
description = "Autonomous, Anti-Ban LinkedIn Intelligence & Sovereign Growth Engine by ModelNorth (modelnorth.com)"
readme = "README.md"
authors = [
    { name = "ModelNorth Sovereign AI", email = "engineering@modelnorth.com" }
]
license = { text = "ModelNorth Sovereign Open License (MN-SL v1.0)" }
keywords = [
    "linkedin",
    "agent",
    "sovereign-ai",
    "anti-ban",
    "lead-generation",
    "playwright",
    "mcp",
    "automation",
    "stealth-browser",
    "modelnorth"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "patchright>=1.40.0; platform_system != 'Darwin' or platform_machine != 'arm64'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0"
]

[project.scripts]
sovereign-linkedin = "sovereign_linkedin.cli:main"
modelnorth-linkedin = "sovereign_linkedin.cli:main"

[project.urls]
Homepage = "https://modelnorth.com"
Documentation = "https://github.com/modelnorth/sovereign-linkedin-agent"
Repository = "https://github.com/modelnorth/sovereign-linkedin-agent.git"
Issues = "https://github.com/modelnorth/sovereign-linkedin-agent/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["src"]
